name: Offline alpha verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Install independent package and build tools
        run: python -m pip install . build
      - name: Core, adapters, authorization and interoperability
        run: python -m unittest discover -s tests -v
      - name: Offline public evidence
        run: python examples/public/recompute.py
      - name: Release export tests
        run: python -m unittest discover -s release -p 'test_*.py' -v
      - name: Build source and wheel
        run: python -m build
      - name: Fresh wheel smoke and uninstall
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install --no-deps dist/*.whl
          wheel-check/bin/python -m pip check
          wheel-check/bin/gcb doctor
          wheel-check/bin/gcb profile demo > offline-demo.json
          wheel-check/bin/python -m pip uninstall -y governed-capability-broker
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: node --test integrations/openclaw-host/*.test.mjs
