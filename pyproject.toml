[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-capability-broker"
version = "0.3.2a1"
description = "Independent local model inventory, cited research, deterministic operations and routing previews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Brandon Gordon and GCB contributors"}]
keywords = ["model-profiling", "routing-preview", "ollama", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
]

[project.scripts]
gcb = "gcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcb = ["fixtures/*.json"]
